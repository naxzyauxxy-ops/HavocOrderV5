# =====================================================
#              HavocOrders - menus.yml
# =====================================================
# Menus are drawn as pictures. STRUCTURE is one line per row, one character per slot,
# and CHARS says what each character means.
#
#   "."  content, the repeating area
#   "<"  previous page    ">"  next page
#
# Every other character names a button under ITEMS. There are no filler panes: empty
# slots stay empty, which reads cleaner than a wall of glass.

LINES:
  SEPARATOR: "&8&m                         "

NAMES:
  SORT:
    MOST-PAID: "Highest payout"
    MOST-DELIVERED: "Most delivered"
    RECENTLY-LISTED: "Newest to oldest"
    MOST-MONEY-PER-ITEM: "Best price per item"
  FILTER:
    ALL: "All items"
    BLOCKS: "Blocks"
    TOOLS: "Tools"
    FOOD: "Food"
    COMBAT: "Combat"
    POTIONS: "Potions"
    BOOKS: "Books"
    INGREDIENTS: "Ingredients"
    UTILITIES: "Other"

FILLER:
  MATERIAL: AIR
  NAME: " "

MENUS:

  ORDERS:
    TITLE: "&8☠ Server &8| &8Orders"
    FILL: false
    STRUCTURE:
      - ". . . . . . . . ."
      - ". . . . . . . . ."
      - ". . . . . . . . ."
      - ". . . . . . . . ."
      - ". . . . . . . . ."
      - "< o f s r y i c >"
    CHARS:
      CONTENT: "."
      PREVIOUS: "<"
      NEXT: ">"
      SORT: "o"
      FILTER: "f"
      SEARCH: "s"
      REFRESH: "r"
      MY-ORDERS: "y"
      INFO: "i"
      CLOSE: "c"
    EMPTY: "&7Nothing matches those filters."
    BODY:
      - "&8Description"
      - ""
      - "&6&lInformation:"
      - "&fOrders players have placed."
      - "&fDeliver the items and get paid."
      - ""
      - "&6&lThis Page:"
      - "&f{results} orders &8• &fpage {page}/{pages}"
    ITEMS:
      INFO:
        MATERIAL: NETHER_STAR
        NAME: "&6&lORDER BOARD"
      ORDER:
        NAME: "&6&l{amount_left}x {material}"
        LORE:
          - "&8{player}"
          - ""
          - "&6&lInformation:"
          - "&fPays &a${unit_price} &fper item."
          - "&fYou are carrying &f{held}&f."
          - ""
          - "&6&lProgress:"
          - "&a| &f{current}&7/&f{max} &7delivered"
          - "&a| &a${paid} &7of &a${max_paid} &7paid"
          - "&a| &7{expires} &7remaining"
          - ""
          - "&e▶ Click to deliver"
      OWN-ORDER:
        NAME: "&a&l{amount_left}x {material}"
        LORE:
          - "&8Your order"
          - ""
          - "&6&lInformation:"
          - "&fYou are paying &a${unit_price} &fper item."
          - ""
          - "&6&lProgress:"
          - "&a| &f{current}&7/&f{max} &7delivered"
          - "&a| &f{collectable} &7waiting to collect"
          - "&a| &7{expires} &7remaining"
          - ""
          - "&e▶ Click to manage"
      SORT:
        MATERIAL: HOPPER
        NAME: "&6&lORDER SORTING"
        SELECTED-FORMAT: "&a| &a▶ {option}"
        UNSELECTED-FORMAT: "&c| &7▶ {option}"
        LORE:
          - "&8Description"
          - ""
          - "&6&lInformation:"
          - "&fChange how orders are sorted"
          - "&fon the order board"
          - ""
          - "&6&lCurrent Selection:"
          - "{sort_options}"
      FILTER:
        MATERIAL: COMPASS
        NAME: "&6&lCATEGORY FILTER"
        SELECTED-FORMAT: "&a| &a▶ {option}"
        UNSELECTED-FORMAT: "&c| &7▶ {option}"
        LORE:
          - "&8Description"
          - ""
          - "&6&lInformation:"
          - "&fShow only one kind of item"
          - "&fon the order board"
          - ""
          - "&6&lCurrent Selection:"
          - "{filter_options}"
      SEARCH:
        MATERIAL: OAK_SIGN
        NAME: "&6&lSEARCH ORDERS"
        LORE:
          - "&8Description"
          - ""
          - "&6&lInformation:"
          - "&fFind orders by item or player."
          - ""
          - "&6&lCurrent Selection:"
          - "&a| &f{query}"
          - ""
          - "&e▶ Click to search"
          - "&8Or use /orders <text>"
      REFRESH:
        MATERIAL: CLOCK
        NAME: "&6&lREFRESH"
        LORE:
          - "&8Description"
          - ""
          - "&6&lInformation:"
          - "&fReload the board to see"
          - "&forders placed just now."
      MY-ORDERS:
        MATERIAL: CHEST
        NAME: "&6&lYOUR ORDERS"
        LORE:
          - "&8Description"
          - ""
          - "&6&lInformation:"
          - "&fManage your own orders,"
          - "&fand collect what was delivered."
      PREVIOUS:
        MATERIAL: ARROW
        NAME: "&6&lPREVIOUS PAGE"
        LORE: [ "&8Page {previous} of {pages}" ]
      NEXT:
        MATERIAL: ARROW
        NAME: "&6&lNEXT PAGE"
        LORE: [ "&8Page {next} of {pages}" ]
      CLOSE:
        MATERIAL: BARRIER
        NAME: "&c&lCLOSE"
        LORE: [ ]

