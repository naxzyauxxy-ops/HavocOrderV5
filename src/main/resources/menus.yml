# =====================================================
#              HavocOrders - menus.yml
# =====================================================
# Menus are drawn as pictures. STRUCTURE is one line per row, one character per slot,
# and CHARS says what each character means, so you can see the shape of a menu here
# instead of counting slot numbers.
#
#   "."  content, the repeating area
#   "g"  border pane      "#"  filler pane
#   "<"  previous page    ">"  next page
#
# Every other character names a button under ITEMS.

LINES:
  SEPARATOR: "&8&m                                                  "

NAMES:
  SORT:
    MOST-PAID: "Highest Payout"
    MOST-DELIVERED: "Most Delivered"
    RECENTLY-LISTED: "Recently Created"
    MOST-MONEY-PER-ITEM: "Best Price/Item"
  FILTER:
    ALL: "All Categories"
    BLOCKS: "Building Blocks"
    TOOLS: "Tools & Equipment"
    FOOD: "Food & Consumables"
    COMBAT: "Combat & Armor"
    POTIONS: "Potions & Brews"
    BOOKS: "Enchanted Books"
    INGREDIENTS: "Crafting Items"
    UTILITIES: "Utilities & Misc"

FILLER:
  MATERIAL: GRAY_STAINED_GLASS_PANE
  NAME: " "

MENUS:

  # ======================| ORDER BOARD |======================

  ORDERS:
    TITLE: "&#FF3B30&lᴏʀᴅᴇʀѕ &8» &7Browse Requests"
    STRUCTURE:
      - "g g g g i g g g g"
      - "g . . . . . . . g"
      - "g . . . . . . . g"
      - "g . . . . . . . g"
      - "g g g g g g g g g"
      - "< # o f s y # x >"
    CHARS:
      CONTENT: "."
      BORDER: "g"
      FILLER: "#"
      INFO: "i"
      BACK: "<"
      PREVIOUS: "<"
      NEXT: ">"
      SORT: "o"
      FILTER: "f"
      SEARCH: "s"
      MY-ORDERS: "y"
      CLOSE: "x"
    BODY:
      - " &7Listings: &f{results}"
      - " &7Page: &e{page}&7/&e{pages}"
      - ""
      - " &7Sort: &f{sort}"
      - " &7Filter: &f{filter}"
      - " &7Search: &f{query}"
    EMPTY: "&7Nothing matches those filters."
    ITEMS:
      INFO:
        MATERIAL: NETHER_STAR
      BORDER:
        MATERIAL: GRAY_STAINED_GLASS_PANE
        NAME: " "
      FILLER:
        MATERIAL: BLACK_STAINED_GLASS_PANE
        NAME: " "
      ORDER:
        NAME: "&#FF3B30&l{player}'s Order"
        LORE:
          - " &7Item Needed: &f{material}"
          - " &7Reward: &#FFCC00${unit_price} &7/ each"
          - " &7Progress: &#34C759{current}&7/&#34C759{max}"
          - " &7Budget: &#FFCC00${paid}&7/&#FFCC00${max_paid}"
          - " &7You carry: &f{held}"
          - " &7Time Left: &e{expires}"
          - ""
          - "&a▸ Click to deliver items!"
      OWN-ORDER:
        NAME: "&#FFCC00&lYour Order"
        LORE:
          - " &7Item Needed: &f{material}"
          - " &7Reward: &#FFCC00${unit_price} &7/ each"
          - " &7Progress: &#34C759{current}&7/&#34C759{max}"
          - " &7Waiting to collect: &f{collectable}"
          - " &7Time Left: &e{expires}"
          - ""
          - "&e▸ Click to manage this order"
      PREVIOUS:
        MATERIAL: RED_STAINED_GLASS_PANE
        LABEL: "&#FF3B30&l« ᴘʀᴇᴠɪᴏᴜѕ ᴘᴀɢᴇ"
        TOOLTIP:
          - "&7Back to page &e{previous}&7/&e{pages}"
      NEXT:
        MATERIAL: LIME_STAINED_GLASS_PANE
        LABEL: "&#34C759&lɴᴇxᴛ ᴘᴀɢᴇ »"
        TOOLTIP:
          - "&7On to page &e{next}&7/&e{pages}"
      SORT:
        MATERIAL: HOPPER
        LABEL: "&#FF3B30&lѕᴏʀᴛ ʙʏ"
        TOOLTIP:
          - " &#FF3B30▸ &f{sort}"
          - ""
          - "&e▸ Click to cycle sorting"
      FILTER:
        MATERIAL: COMPASS
        LABEL: "&#FF3B30&lᴄᴀᴛᴇɢᴏʀʏ ꜰɪʟᴛᴇʀ"
        TOOLTIP:
          - " &#FF3B30▸ &f{filter}"
          - ""
          - "&e▸ Click to cycle categories"
      SEARCH:
        MATERIAL: OAK_SIGN
        LABEL: "&#FF3B30&lѕᴇᴀʀᴄʜ"
        TOOLTIP:
          - "&7Current: &f{query}"
          - ""
          - "&e▸ Click to search"
          - "&8Or use /orders <text>"
      MY-ORDERS:
        MATERIAL: CHEST
        LABEL: "&#FFCC00&lʏᴏᴜʀ ᴏʀᴅᴇʀѕ"
        TOOLTIP:
          - "&7View and manage your orders."
      CLOSE:
        MATERIAL: BARRIER
        LABEL: "&#FF3B30&l✖ ᴄʟᴏѕᴇ"
        TOOLTIP: [ ]

  # ======================| SEARCH |======================

  SEARCH:
    TITLE: "&#FF3B30&lѕᴇᴀʀᴄʜ"
    STRUCTURE:
      - "g g g g i g g g g"
      - "g . v . # . x . g"
      - "g g g g g g g g g"
    CHARS:
      CONTENT: "."
      BORDER: "g"
      FILLER: "#"
      INFO: "i"
      CONFIRM: "v"
      CLEAR: "#"
      BACK: "x"
    BODY:
      - "&7Type what you are looking for."
    INPUT-LABEL: "search"
    ITEMS:
      INFO:
        MATERIAL: OAK_SIGN
      BORDER:
        MATERIAL: GRAY_STAINED_GLASS_PANE
        NAME: " "
      CONFIRM:
        MATERIAL: LIME_CONCRETE
        LABEL: "&#34C759&l✔ ѕᴇᴀʀᴄʜ"
        TOOLTIP: [ "&7Run the search." ]
      CLEAR:
        MATERIAL: RED_DYE
        LABEL: "&#FF3B30&lᴄʟᴇᴀʀ"
        TOOLTIP: [ "&7Remove the current search." ]
      INPUT:
        MATERIAL: OAK_SIGN
        LABEL: "&#FFCC00&lᴇɴᴛᴇʀ ᴛᴇʀᴍ"
        TOOLTIP: [ "&7Click, then type in chat." ]
      BACK:
        MATERIAL: RED_STAINED_GLASS_PANE
        LABEL: "&#FF3B30&l« ʙᴀᴄᴋ"
        TOOLTIP: [ ]

  # ======================| DELIVER |======================

  DELIVER:
    TITLE: "&#FF3B30&lᴏʀᴅᴇʀѕ &8» &7Deliver Items"
    STRUCTURE:
      - "g g g g i g g g g"
      - "g . d . a . q . g"
      - "g g g g x g g g g"
    CHARS:
      CONTENT: "."
      BORDER: "g"
      INFO: "i"
      DELIVER: "d"
      DELIVER-ALL: "a"
      INPUT: "q"
      BACK: "x"
    QUICK-AMOUNTS: [ 64, 576, 1728 ]
    BODY:
      - " &7Order by: &f{player}"
      - " &7Reward: &#FFCC00${unit_price} &7/ each"
      - " &7Progress: &#34C759{current}&7/&#34C759{max}"
      - " &7Still wanted: &f{remaining}"
      - ""
      - " &7In inventory: &f{held_inventory}"
      - " &7In shulkers: &f{held_shulkers}"
      - " &7Deliverable now: &#34C759{deliverable}"
      - " &7Payout: &#FFCC00${payout}"
      - ""
      - " &7Expires in: &e{expires}"
    INPUT-LABEL: "amount"
    ITEMS:
      BORDER:
        MATERIAL: GRAY_STAINED_GLASS_PANE
        NAME: " "
      DELIVER:
        MATERIAL: LIME_CONCRETE
        LABEL: "&#34C759&l✔ ᴅᴇʟɪᴠᴇʀ"
        TOOLTIP:
          - "&7Delivers the amount you set."
          - "&8Unset delivers &f{deliverable}"
      DELIVER-ALL:
        MATERIAL: GOLD_BLOCK
        LABEL: "&#FFCC00&lᴅᴇʟɪᴠᴇʀ ᴀʟʟ &7({deliverable})"
        TOOLTIP:
          - "&7Everything you carry, including"
          - "&7inside shulker boxes."
          - " &7Pays: &#FFCC00${payout}"
      QUICK:
        MATERIAL: HOPPER
        LABEL: "&#FFCC00&lᴅᴇʟɪᴠᴇʀ {amount}"
        TOOLTIP: [ " &7Pays: &#FFCC00${value}" ]
      INPUT:
        MATERIAL: OAK_SIGN
        LABEL: "&#FFCC00&lѕᴇᴛ ᴀᴍᴏᴜɴᴛ"
        TOOLTIP: [ "&7Click, then type in chat." ]
      BACK:
        MATERIAL: RED_STAINED_GLASS_PANE
        LABEL: "&#FF3B30&l« ʙᴀᴄᴋ ᴛᴏ ᴏʀᴅᴇʀѕ"
        TOOLTIP: [ ]

  # ======================| YOUR ORDERS |======================

  MY-ORDERS:
    TITLE: "&#FF3B30&lᴏʀᴅᴇʀѕ &8» &7Your Active Orders"
    STRUCTURE:
      - "g g g g i g g g g"
      - "g . . . . . . . g"
      - "g . . . . . . . g"
      - "g . . . . . . . g"
      - "g g g g g g g g g"
      - "< x n c a # # # >"
    CHARS:
      CONTENT: "."
      BORDER: "g"
      FILLER: "#"
      INFO: "i"
      PREVIOUS: "<"
      NEXT: ">"
      BACK: "x"
      NEW-ORDER: "n"
      COLLECT: "c"
      ALERTS: "a"
    BODY:
      - " &7Active orders: &f{count}"
      - " &7Escrow held: &#FFCC00${escrow}"
      - " &7Waiting to collect: &#34C759{collectable}"
      - ""
      - " &7Page: &e{page}&7/&e{pages}"
    EMPTY: "&7You have no orders yet."
    ITEMS:
      INFO:
        MATERIAL: CHEST
      BORDER:
        MATERIAL: GRAY_STAINED_GLASS_PANE
        NAME: " "
      FILLER:
        MATERIAL: BLACK_STAINED_GLASS_PANE
        NAME: " "
      ORDER:
        NAME: "&#FF3B30&l{material}"
        LORE:
          - " &7Reward: &#FFCC00${unit_price} &7/ each"
          - " &7Progress: &#34C759{current}&7/&#34C759{max}"
          - " &7Payout: &#FFCC00${paid}&7/&#FFCC00${max_paid}"
          - " &7Waiting: &f{collectable}"
          - " &7Expires in: &e{expires}"
          - ""
          - "&e▸ Click to manage"
      NEW-ORDER:
        MATERIAL: WRITABLE_BOOK
        LABEL: "&#34C759&l+ ᴄʀᴇᴀᴛᴇ ɴᴇᴡ ᴏʀᴅᴇʀ"
        TOOLTIP:
          - "&7Set up a new item request."
      COLLECT:
        MATERIAL: CHEST_MINECART
        LABEL: "&#FFCC00&lɢᴀᴛʜᴇʀ ɪᴛᴇᴍѕ &7({collectable})"
        TOOLTIP:
          - "&7Collect, drop or sell deliveries."
      ALERTS:
        MATERIAL: BELL
        LABEL: "&#FFCC00&lᴀʟᴇʀᴛѕ: &f{alerts}"
        TOOLTIP:
          - "&7Chat message when someone delivers."
      PREVIOUS:
        MATERIAL: RED_STAINED_GLASS_PANE
        LABEL: "&#FF3B30&l« ᴘʀᴇᴠɪᴏᴜѕ ᴘᴀɢᴇ"
        TOOLTIP: [ ]
      NEXT:
        MATERIAL: LIME_STAINED_GLASS_PANE
        LABEL: "&#34C759&lɴᴇxᴛ ᴘᴀɢᴇ »"
        TOOLTIP: [ ]
      BACK:
        MATERIAL: BARRIER
        LABEL: "&#FF3B30&l« ʙᴀᴄᴋ"
        TOOLTIP: [ ]

  MANAGE-ORDER:
    TITLE: "&#FF3B30&lᴏʀᴅᴇʀѕ &8» &7Edit Order"
    STRUCTURE:
      - "g g g g i g g g g"
      - "g . c . # . k . g"
      - "g g g g x g g g g"
    CHARS:
      CONTENT: "."
      BORDER: "g"
      FILLER: "#"
      INFO: "i"
      COLLECT: "c"
      CANCEL-ORDER: "k"
      BACK: "x"
    BODY:
      - " &7Item: &f{material}"
      - " &7Price: &#FFCC00${unit_price} &7each"
      - " &7Progress: &#34C759{current}&7/&#34C759{max}"
      - " &7Payout: &#FFCC00${paid}&7/&#FFCC00${max_paid}"
      - " &7Waiting to collect: &f{collectable}"
      - " &7Refund if cancelled: &#34C759${refund}"
      - ""
      - " &7Expires in: &e{expires}"
    ITEMS:
      BORDER:
        MATERIAL: GRAY_STAINED_GLASS_PANE
        NAME: " "
      COLLECT:
        MATERIAL: CHEST_MINECART
        LABEL: "&#FFCC00&lɢᴀᴛʜᴇʀ ɪᴛᴇᴍѕ"
        TOOLTIP: [ "&7Collect what has been delivered." ]
      CANCEL-ORDER:
        MATERIAL: RED_CONCRETE
        LABEL: "&#FF3B30&l✖ ᴄᴀɴᴄᴇʟ ᴏʀᴅᴇʀ"
        TOOLTIP:
          - "&7Refunds &#34C759${refund}"
      BACK:
        MATERIAL: RED_STAINED_GLASS_PANE
        LABEL: "&#FF3B30&l« ʙᴀᴄᴋ"
        TOOLTIP: [ ]

  CANCEL-CONFIRM:
    TITLE: "&#FF3B30&lᴄᴏɴꜰɪʀᴍ ᴄᴀɴᴄᴇʟʟᴀᴛɪᴏɴ"
    STRUCTURE:
      - "g g g g g g g g g"
      - "g . x . i . v . g"
      - "g g g g g g g g g"
    CHARS:
      CONTENT: "."
      BORDER: "g"
      INFO: "i"
      BACK: "x"
      CONFIRM: "v"
    BODY:
      - " &7Cancel your order for"
      - " &#FF3B30{max} {material}&7?"
      - ""
      - " &7You get back: &#34C759${refund}"
    ITEMS:
      BORDER:
        MATERIAL: GRAY_STAINED_GLASS_PANE
        NAME: " "
      CONFIRM:
        MATERIAL: LIME_CONCRETE
        LABEL: "&#34C759&l✔ ᴄᴏɴꜰɪʀᴍ ᴄᴀɴᴄᴇʟ"
        TOOLTIP: [ "&7Cancel and return remaining funds." ]
      BACK:
        MATERIAL: RED_CONCRETE
        LABEL: "&#FF3B30&l« ɢᴏ ʙᴀᴄᴋ"
        TOOLTIP: [ "&7Keep the order active." ]

  # ======================| NEW ORDER |======================

  NEW-ORDER:
    TITLE: "&#FF3B30&lᴏʀᴅᴇʀѕ &8» &7New Order"
    STRUCTURE:
      - "g g g g i g g g g"
      - "g s . a . p . e g"
      - "g g g x g v g g g"
    CHARS:
      CONTENT: "."
      BORDER: "g"
      INFO: "i"
      CHOOSE-ITEM: "s"
      HELD-ITEM: "a"
      INPUT: "p"
      ENCHANTS: "e"
      CONFIRM: "v"
      BACK: "x"
    BODY:
      - " &7Item: &f{material}"
      - " &7Amount: &e{amount}"
      - " &7Unit Price: &#FFCC00${price}"
      - " &7Enchantments: {enchants}"
      - ""
      - " &7Total Cost: &#FFCC00${total}"
      - " &7Your Balance: &#34C759${balance}"
      - ""
      - " &8Amounts accept 1k, 2.5k, 1m"
    AMOUNT-LABEL: "amount"
    PRICE-LABEL: "unit price"
    ITEMS:
      INFO:
        MATERIAL: WRITABLE_BOOK
      BORDER:
        MATERIAL: GRAY_STAINED_GLASS_PANE
        NAME: " "
      CHOOSE-ITEM:
        MATERIAL: ITEM_FRAME
        LABEL: "&#FFCC00&lѕᴇʟᴇᴄᴛ ɪᴛᴇᴍ"
        TOOLTIP:
          - "&7Current: &f{material}"
          - ""
          - "&e▸ Click to browse items"
      HELD-ITEM:
        MATERIAL: DROPPER
        LABEL: "&#FFCC00&lᴜѕᴇ ʜᴇʟᴅ ɪᴛᴇᴍ"
        TOOLTIP: [ "&7Order whatever is in your hand." ]
      INPUT:
        MATERIAL: GOLD_INGOT
        LABEL: "&#FFCC00&lѕᴇᴛ ᴀᴍᴏᴜɴᴛ / ᴘʀɪᴄᴇ"
        TOOLTIP: [ "&7Click, then type in chat." ]
      ENCHANTS:
        MATERIAL: ENCHANTING_TABLE
        LABEL: "&#FFCC00&lᴇɴᴄʜᴀɴᴛᴍᴇɴᴛѕ"
        TOOLTIP:
          - "&7Current: {enchants}"
          - ""
          - "&e▸ Click to choose"
      CONFIRM:
        MATERIAL: LIME_CONCRETE
        LABEL: "&#34C759&l✔ ᴄᴏɴꜰɪʀᴍ ᴏʀᴅᴇʀ"
        TOOLTIP:
          - " &7Total Cost: &#FFCC00${total}"
          - "&a▸ Click to create order"
      BACK:
        MATERIAL: RED_STAINED_GLASS_PANE
        LABEL: "&#FF3B30&l« ᴄᴀɴᴄᴇʟ"
        TOOLTIP: [ "&7Return without saving." ]

  ITEM-PICKER:
    TITLE: "&#FF3B30&lᴏʀᴅᴇʀѕ &8» &7Select Item"
    STRUCTURE:
      - "g g g g i g g g g"
      - "g . . . . . . . g"
      - "g . . . . . . . g"
      - "g . . . . . . . g"
      - "g g g g g g g g g"
      - "< # f s x # # # >"
    CHARS:
      CONTENT: "."
      BORDER: "g"
      FILLER: "#"
      INFO: "i"
      PREVIOUS: "<"
      NEXT: ">"
      FILTER: "f"
      SEARCH: "s"
      BACK: "x"
    BODY:
      - " &7Items: &f{results}"
      - " &7Page: &e{page}&7/&e{pages}"
      - ""
      - " &7Filter: &f{filter}"
      - " &7Search: &f{query}"
    EMPTY: "&7No items match that search."
    ITEMS:
      INFO:
        MATERIAL: COMPASS
      BORDER:
        MATERIAL: GRAY_STAINED_GLASS_PANE
        NAME: " "
      FILLER:
        MATERIAL: BLACK_STAINED_GLASS_PANE
        NAME: " "
      ITEM:
        NAME: "&#FFCC00&l{name}"
        LORE: [ "&a▸ Click to select this item" ]
      FILTER:
        MATERIAL: COMPASS
        LABEL: "&#FF3B30&lᴄᴀᴛᴇɢᴏʀʏ ꜰɪʟᴛᴇʀ"
        TOOLTIP:
          - " &#FF3B30▸ &f{filter}"
          - ""
          - "&e▸ Click to cycle"
      SEARCH:
        MATERIAL: OAK_SIGN
        LABEL: "&#FF3B30&lѕᴇᴀʀᴄʜ"
        TOOLTIP: [ "&7Current: &f{query}" ]
      PREVIOUS:
        MATERIAL: RED_STAINED_GLASS_PANE
        LABEL: "&#FF3B30&l« ᴘʀᴇᴠɪᴏᴜѕ ᴘᴀɢᴇ"
        TOOLTIP: [ ]
      NEXT:
        MATERIAL: LIME_STAINED_GLASS_PANE
        LABEL: "&#34C759&lɴᴇxᴛ ᴘᴀɢᴇ »"
        TOOLTIP: [ ]
      BACK:
        MATERIAL: BARRIER
        LABEL: "&#FF3B30&l« ʙᴀᴄᴋ"
        TOOLTIP: [ ]

  ENCHANT-PICKER:
    TITLE: "&#FF3B30&lѕᴇʟᴇᴄᴛ ᴇɴᴄʜᴀɴᴛᴍᴇɴᴛ"
    STRUCTURE:
      - "g g g g i g g g g"
      - "g . . . . . . . g"
      - "g . . . . . . . g"
      - "g . . . . . . . g"
      - "g g g g g g g g g"
      - "< # # # x # # # >"
    CHARS:
      CONTENT: "."
      BORDER: "g"
      FILLER: "#"
      INFO: "i"
      PREVIOUS: "<"
      NEXT: ">"
      BACK: "x"
    BODY:
      - " &7Page: &e{page}&7/&e{pages}"
    ITEMS:
      INFO:
        MATERIAL: ENCHANTED_BOOK
      BORDER:
        MATERIAL: GRAY_STAINED_GLASS_PANE
        NAME: " "
      FILLER:
        MATERIAL: BLACK_STAINED_GLASS_PANE
        NAME: " "
      ENCHANT:
        NAME: "&#FFCC00&l{enchantment} {level}"
        LORE: [ "&a▸ Click to select this enchantment" ]
      PREVIOUS:
        MATERIAL: RED_STAINED_GLASS_PANE
        LABEL: "&#FF3B30&l« ᴘʀᴇᴠɪᴏᴜѕ ᴘᴀɢᴇ"
        TOOLTIP: [ ]
      NEXT:
        MATERIAL: LIME_STAINED_GLASS_PANE
        LABEL: "&#34C759&lɴᴇxᴛ ᴘᴀɢᴇ »"
        TOOLTIP: [ ]
      BACK:
        MATERIAL: BARRIER
        LABEL: "&#FF3B30&l« ʙᴀᴄᴋ"
        TOOLTIP: [ ]

  ENCHANT-EDIT:
    TITLE: "&#FF3B30&lѕᴇʟᴇᴄᴛ ᴇɴᴄʜᴀɴᴛᴍᴇɴᴛѕ"
    STRUCTURE:
      - "g g g g i g g g g"
      - "g . . . . . . . g"
      - "g . . . . . . . g"
      - "g . . . . . . . g"
      - "g g g g g g g g g"
      - "< # # c x # # # >"
    CHARS:
      CONTENT: "."
      BORDER: "g"
      FILLER: "#"
      INFO: "i"
      PREVIOUS: "<"
      NEXT: ">"
      CLEAR: "c"
      BACK: "x"
    BODY:
      - " &7Item: &f{material}"
      - " &7Chosen: {applied}"
      - ""
      - " &7Page: &e{page}&7/&e{pages}"
    ITEMS:
      BORDER:
        MATERIAL: GRAY_STAINED_GLASS_PANE
        NAME: " "
      FILLER:
        MATERIAL: BLACK_STAINED_GLASS_PANE
        NAME: " "
      ENCHANT:
        MATERIAL: BOOK
        LABEL: "&7{enchantment}"
        TOOLTIP: [ "&e▸ Click to choose a level" ]
      ENCHANT-ACTIVE:
        MATERIAL: ENCHANTED_BOOK
        LABEL: "&#34C759&l{enchantment} {level}"
        TOOLTIP:
          - " &#34C759✔ Currently Selected"
          - "&7Click to change or remove."
      CLEAR:
        MATERIAL: RED_DYE
        LABEL: "&#FF3B30&lᴄʟᴇᴀʀ ᴀʟʟ"
        TOOLTIP: [ "&7Remove every enchantment." ]
